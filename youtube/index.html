<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Kênh YouTube — XOI GAME</title>
<link rel="icon" href="/assets/brand.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="gate" class="gate" hidden>
  <form id="gate-form" class="gate-box" autocomplete="off">
    <h1>Kênh YouTube</h1>
    <p class="muted">XOI GAME · bảng điều khiển nội bộ. Nhập mật khẩu để xem dữ liệu.</p>
    <label for="gate-pw" class="sr">Mật khẩu</label>
    <input id="gate-pw" type="password" placeholder="Mật khẩu" autocomplete="current-password" required>
    <label class="check"><input id="gate-remember" type="checkbox"> Nhớ trên máy này</label>
    <p id="gate-msg" class="gate-msg" role="alert" aria-live="polite"></p>
    <button id="gate-btn" class="btn btn-primary" type="submit">Mở</button>
  </form>
</div>

<div id="fatal" class="fatal" hidden>
  <div class="gate-box">
    <h1>Không tải được dữ liệu</h1>
    <p id="fatal-msg" class="muted"></p>
  </div>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="wrap">
      <div class="brand">
        <h1>Kênh YouTube</h1>
        <span class="muted small">XOI GAME · bảng điều khiển nội bộ</span>
      </div>
      <nav class="tabs" id="tabs" aria-label="Mục chính">
        <a href="#tongquan" data-tab="tongquan">Tổng quan</a>
        <a href="#tap" data-tab="tap">Tập</a>
        <a href="#lich" data-tab="lich">Lịch</a>
        <a href="#viec" data-tab="viec">Việc tiếp theo</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section id="tab-tongquan" class="panel" hidden>
      <div id="stats" class="stats"></div>
      <div id="channels" class="channels"></div>
    </section>

    <section id="tab-tap" class="panel" hidden>
      <div class="filters">
        <div id="f-channels" class="chips" role="group" aria-label="Lọc theo kênh"></div>
        <div class="filter-row">
          <select id="f-stage" aria-label="Lọc theo trạng thái"></select>
          <input id="f-search" type="search" placeholder="Tìm mã hoặc tiêu đề..." aria-label="Tìm tập">
        </div>
      </div>
      <p id="ep-count" class="muted small"></p>
      <div id="episodes" class="episodes"></div>
    </section>

    <section id="tab-lich" class="panel" hidden>
      <h2>Lịch đăng hằng tuần</h2>
      <div id="week" class="week"></div>
      <h2>Thứ tự ra mắt</h2>
      <div id="launch" class="launch"></div>
      <p id="sched-updated" class="muted small"></p>
    </section>

    <section id="tab-viec" class="panel" hidden>
      <div id="todo"></div>
    </section>
  </main>

  <footer class="foot">
    <div class="wrap">
      <div class="muted small">
        <div>Cập nhật dữ liệu: <span id="ft-generated">—</span></div>
        <div>Bảng Tập đang làm: <span id="ft-working">—</span></div>
      </div>
      <div class="foot-links">
        <a href="/">← xoigame.com</a>
        <button id="lock" class="btn" type="button" hidden>Khoá lại</button>
      </div>
    </div>
  </footer>
</div>

<noscript><p style="padding:24px">Cần bật JavaScript để xem bảng điều khiển.</p></noscript>
<script src="app.js"></script>
</body>
</html>
