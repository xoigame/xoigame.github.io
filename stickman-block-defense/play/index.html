  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#11120f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <meta name="robots" content="noindex">
  <title>Stickman Block Defense — Play on XOI GAME</title>
  <style>
    html, body { overscroll-behavior: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #11120f; touch-action: none; -webkit-user-select: none; user-select: none; }
    #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #unity-canvas { display: block; background: #000; outline: none; width: 100%; height: 100%; }
    @media (hover: hover) and (pointer: fine) {
      /* Máy tính: giữ đúng tỉ lệ khung hình của game, canh giữa. */
      #unity-canvas { width: min(100vw, calc(100vh * 720 / 1280)); height: min(100vh, calc(100vw * 1280 / 720)); }
    }
    #xoi-loading { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #11120f; color: #f4f1e8; font: 600 17px/1.3 system-ui, sans-serif; text-align: center; padding: 0 24px; }
    #xoi-bar { width: 60%; max-width: 320px; height: 10px; border-radius: 5px; background: #2b2d26; overflow: hidden; }
    #xoi-fill { width: 0%; height: 100%; background: #ffcc33; transition: width .15s; }
    #xoi-hint { font-weight: 400; font-size: 13px; opacity: .65; }
    #xoi-tools { position: fixed; top: max(10px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right)); display: flex; gap: 8px; z-index: 5; opacity: 0; transition: opacity .2s; }
    #xoi-tools.on { opacity: .75; }
    #xoi-tools a, #xoi-tools button { min-width: 44px; height: 44px; padding: 0 14px; border-radius: 22px; border: 0; background: rgba(17,18,15,.72); color: #fff; font: 600 14px system-ui, sans-serif; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
    #xoi-error { display: none; }
    #xoi-icon { display: none; width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 6px 24px rgba(0,0,0,.45); }
    .xoi-store { display: none; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 22px; background: #ffcc33; color: #11120f; font: 700 14px system-ui, sans-serif; text-decoration: none; }
    #xoi-loading .xoi-store { margin-top: 6px; }
    #xoi-tools .xoi-store { height: 44px; padding: 0 16px; background: rgba(255,204,51,.92); color: #11120f; }
    #xoi-rotate { display: none; position: fixed; inset: 0; z-index: 9; background: rgba(17,18,15,.94); color: #f4f1e8; font: 600 18px/1.4 system-ui, sans-serif; text-align: center; align-items: center; justify-content: center; padding: 24px; }

</head>
<body>
  <div id="stage"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
  <div id="xoi-tools"><a class="xoi-store" id="xoi-store-tool" rel="noopener">Get the app</a><button id="xoi-fs" type="button" aria-label="Toggle fullscreen">&#x26F6;</button><a id="xoi-back" href="/" aria-label="Back to XOI GAME">&#x2715;</a></div>
  <div id="xoi-rotate">Turn your phone sideways<br>to play this game</div>
  <div id="xoi-loading"><img id="xoi-icon" alt=""><div>Stickman Block Defense</div><div id="xoi-bar"><div id="xoi-fill"></div></div><div id="xoi-hint">Loading&hellip; the first visit downloads the game, later visits are faster.</div><div id="xoi-error"></div><a class="xoi-store" id="xoi-store-load" rel="noopener">Get the Android app</a></div>
  <script>
  (function () {
    // Điền lúc đăng lên web bởi tools/gdh_webplay.py (chuỗi bắt đầu bằng "__" = chưa điền).
    var XOI = { store: "", icon: "/stickman-block-defense/play/icon.png" };
    function val(v) { return (v && v.indexOf("__") !== 0) ? v : ""; }
    var iconEl = document.querySelector("#xoi-icon");
    if (val(XOI.icon)) {
      iconEl.src = XOI.icon; iconEl.style.display = "block";
      document.querySelector("#xoi-favicon").href = XOI.icon;
    }
    ["#xoi-store-load", "#xoi-store-tool"].forEach(function (id) {
      var a = document.querySelector(id);
      if (val(XOI.store)) { a.href = XOI.store; a.style.display = "inline-flex"; }
    });
    var isTouch = matchMedia("(pointer: coarse)").matches;

    var canvas = document.querySelector("#unity-canvas");
    var fill = document.querySelector("#xoi-fill");
    var loading = document.querySelector("#xoi-loading");
    var tools = document.querySelector("#xoi-tools");
    var hint = document.querySelector("#xoi-hint");
    var err = document.querySelector("#xoi-error");

    // Nút "x" về trang giới thiệu game: /<slug>/play/ -> /<slug>/
    var back = document.querySelector("#xoi-back");
    var parts = location.pathname.replace(/\/+$/, "").split("/");
    parts.pop();
    back.href = parts.join("/") + "/";

    var config = {
      dataUrl: "Build/1.0.data.unityweb",
      frameworkUrl: "Build/1.0.framework.js.unityweb",
      codeUrl: "Build/1.0.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "XoiGame",
      productName: "Stickman Block Defense",
      productVersion: "1.0",
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, isTouch ? 1.5 : 2)
    };

    function fail(msg) {
      hint.style.display = "none";
      err.style.display = "block";
      err.textContent = "Sorry, this game could not start in your browser. " + msg;
    }

    // Game ngang mà điện thoại đang dựng dọc => nhắc xoay máy.
    var wantLandscape = 720 > 1280;
    var rotate = document.querySelector("#xoi-rotate");
    function checkRotate() {
      var touch = matchMedia("(pointer: coarse)").matches;
      var portrait = window.innerHeight > window.innerWidth;
      rotate.innerHTML = wantLandscape ? "Turn your phone sideways<br>to play this game" : "Turn your phone upright<br>to play this game";
      rotate.classList.toggle("on", touch && (wantLandscape ? portrait : !portrait));
    }
    window.addEventListener("resize", checkRotate);
    checkRotate();

    if (!window.WebAssembly) { fail("WebAssembly is not supported."); return; }

    var script = document.createElement("script");
    script.src = "Build/1.0.loader.js";
    script.onload = function () {
      createUnityInstance(canvas, config, function (p) { fill.style.width = (100 * p) + "%"; })
        .then(function (instance) {
          loading.style.display = "none";
          var wake = function () {
            tools.classList.add("on");
            clearTimeout(wake.t);
            wake.t = setTimeout(function () { tools.classList.remove("on"); }, 3000);
          };
          if (!document.documentElement.requestFullscreen) document.querySelector("#xoi-fs").style.display = "none";
          wake();
          window.addEventListener("pointermove", wake);
          document.querySelector("#xoi-fs").onclick = function () {
            if (document.fullscreenElement) { document.exitFullscreen(); }
            else if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen().catch(function () {}); }
            else { instance.SetFullscreen(1); }
          };
        })
        .catch(function (e) { fail(String(e)); });
    };
    script.onerror = function () { fail("The game files failed to load."); };
    document.body.appendChild(script);
  })();
  </script>
</body>
</html>
